name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install system dependencies
        timeout-minutes: 3
        run: |
          if ! command -v msgfmt >/dev/null || ! command -v dbus-run-session >/dev/null; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends gettext dbus-daemon
          fi
      - run: python -m pip install -e .
      - run: python scripts/translations.py
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh uninstall.sh
      - run: python scripts/build.py
      - run: git diff --exit-code -- package/contents/ui/Translations.js
