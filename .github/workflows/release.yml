name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y gettext dbus-daemon
      - run: python -m pip install -e .
      - name: Check release version
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          PY
      - run: python scripts/translations.py && python -m unittest discover -s tests -v
      - run: bash -n install.sh uninstall.sh && python scripts/build.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.plasmoid dist/*-source.zip dist/SHA256SUMS \
            --verify-tag --title "KCromecast ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md
